      },
      "IAM": {
        "Type": "AWS::IAM::Role",
        "Title": "API + build roles/profiles\nSSM | CloudWatch | Secret\nBuild: artifact read"
      },
      "CW": {
        "Type": "AWS::CloudWatch::Alarm",
        "Title": "Seoul logs: 30d\nALB / EC2 / build / RDS\n6 WAS + 3 DB alarms\nActions disabled"
      },
      "ACM": {
        "Type": "AWS::CertificateManager::Certificate",
